appId: com.cowork.app
productName: Cowork
executableName: cowork
directories:
  output: release
  buildResources: build
asar: true
asarUnpack:
  - node_modules/msgpackr/**/*
files:
  - package.json
  - src/**/*
  - node_modules/msgpackr/**/*
extraResources:
  - from: "src/resources/cowork-agent"
    to: "cowork-agent"
    filter: ["**/*"]
  - from: "src/resources/skills"
    to: "skills"
    filter: ["**/*"]

mac:
  category: public.app-category.developer-tools
  icon: src/resources/icons/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]

win:
  icon: src/resources/icons/icon.png
  target:
    - target: nsis
      arch: [x64]
