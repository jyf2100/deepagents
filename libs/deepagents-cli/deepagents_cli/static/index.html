<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepAgents Web UI</title>
    <link rel="stylesheet" href="/static/style.css?v=17">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>DeepAgents</h2>
                <button id="btn-new-chat" class="btn-new-chat">+ 新对话</button>
            </div>
            <div id="session-list" class="session-list">
                <!-- Sessions will be rendered here -->
            </div>
        </aside>

        <!-- Main content -->
        <div class="container">
            <header>
                <div class="header-left">
                    <button id="btn-toggle-sidebar" class="btn-toggle-sidebar">☰</button>
                    <h1 id="session-title">新对话</h1>
                </div>
                <div class="header-actions">
                    <a href="https://vscode.dev/github/langchain-ai/deepagents" target="_blank" rel="noopener noreferrer" class="btn-vscode" title="VS Code Online (vscode.dev)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
                        </svg>
                    </a>
                    <button id="btn-vscode-local" class="btn-vscode-local" title="本地 VS Code Web (离线)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-8.93h2c0 1.45 1.91 2.81 5 8.93 0zm0-14c-3.09 0-5 7.48-5 8.93h2c0-5.08 3.05-8.44 7-8.93z"/>
                        </svg>
                    </button>
                    <button id="btn-sandbox-vscode" class="btn-sandbox-vscode" title="New Sandbox VS Code">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
                        </svg>
                    </button>
                </div>
                <div id="status">连接中...</div>
            </header>

            <main>
                <div id="events"></div>

                <!-- HITL Approval Dialog -->
                <div id="hitl-dialog" class="hidden">
                    <div class="hitl-content">
                        <h3>⚠️ 工具调用审批</h3>
                        <pre id="hitl-details"></pre>
                        <div class="buttons">
                            <button id="btn-approve">批准</button>
                            <button id="btn-reject">拒绝</button>
                        </div>
                    </div>
                </div>
            </main>

            <footer>
                <input id="user-input" type="text" placeholder="输入消息..." autofocus>
                <button id="btn-send">发送</button>
            </footer>
        </div>
    </div>

    <script src="/static/app.js?v=19"></script>
</body>
</html>
