name: CI

on:
  push:
    branches: [phase-2-desktop-client, main]
  pull_request:
    branches: [phase-2-desktop-client, main]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd libs/deepagents-cli
          uv sync

      - name: Run linting
        run: |
          cd libs/deepagents-cli
          uv run ruff check deepagents_cli/desktop/

      - name: Run type checking
        run: |
          cd libs/deepagents-cli
          uv run mypy deepagents_cli/desktop/

      - name: Run unit tests
        run: |
          cd libs/deepagents-cli
          uv run pytest tests/unit_tests/test_desktop_protocol.py -v --cov=deepagents_cli/desktop

  node-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd desktop
          npm install

      - name: Run tests
        run: |
          cd desktop
          npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests, node-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd libs/deepagents-cli
          uv sync
          cd ../desktop
          npm install

      - name: Run integration tests
        run: |
          cd desktop
          npm test -- test/integration/
